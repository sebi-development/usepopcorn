<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
  <!-- fetch() to Supabase and the TMDB API is CORS without credentials, which uses a separate
       socket pool: only a crossorigin preconnect is reused. <img> loads are no-cors: no attribute. -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <!-- App font: fetched next to the JS so it is ready by the first render (font-display: optional) -->
  <link rel="preload" href="/src/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07090b" />
  <meta name="description" content="Discover movies and series, rate what you watch, follow friends and see your viewing stats." />
  <title>usePopcorn</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
